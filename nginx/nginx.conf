server {
    listen 80;
    server_name _;

    # Serve original documents (PDFs, images)
    location /documents/ {
        alias /usr/share/nginx/html/documents/;
        autoindex off;

        # Cache static assets
        expires 7d;
        add_header Cache-Control "public, immutable";

        # CORS for Next.js app
        add_header Access-Control-Allow-Origin "*";
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
