services:
  web:
    build: .
    ports:
      - "3100:3000"
    env_file: .env
    restart: unless-stopped
    depends_on:
      - docs

  docs:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./documents:/usr/share/nginx/html/documents:ro
    restart: unless-stopped
